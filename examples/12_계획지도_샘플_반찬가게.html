<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동네 반찬가게 주문받기 — 만들기 전 계획</title>
<style>
  :root{
    --paper:#F4F3F7; --card:#FFFFFF; --ink:#251F33; --ink2:#635C74;
    --rule:#DAD5E4; --plan:#5B4B9A; --ok:#2E7D62; --warn:#A85A2B;
    --sans:-apple-system,"Pretendard","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    --mono:ui-monospace,SFMono-Regular,"JetBrains Mono","D2Coding",Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans);
    font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:860px; margin:0 auto; padding:32px 20px 80px}
  a{color:var(--plan)}
  button{font:inherit; color:inherit; cursor:pointer}

  /* 머리말 */
  h1{margin:0; font-size:28px; letter-spacing:-.02em; font-weight:650}
  .one{margin:8px 0 0; font-size:18px; color:var(--ink2); max-width:60ch}
  .facts{margin:20px 0 0; display:flex; flex-wrap:wrap; gap:10px 28px; font-size:14px; color:var(--ink2)}
  .facts b{color:var(--ink); font-weight:600}
  .bar{margin:22px 0 0; height:8px; background:#E4E0EC; border-radius:99px; overflow:hidden}
  .bar i{display:block; height:100%; width:0; background:var(--ok); transition:width .35s}
  .barlab{margin:8px 0 0; font-size:13.5px; color:var(--ink2)}

  .toolbar{margin:18px 0 0; display:flex; flex-wrap:wrap; gap:8px}
  .toolbar button{
    background:var(--card); border:1px solid var(--rule); border-radius:6px; padding:7px 12px; font-size:14px;
  }
  .toolbar button:hover{border-color:var(--plan); color:var(--plan)}
  .toolbar button[aria-pressed="true"]{background:var(--plan); border-color:var(--plan); color:#fff}

  /* 단계 */
  .lane{margin:34px 0 0; position:relative; padding-left:46px}
  .lane::before{
    content:""; position:absolute; left:17px; top:8px; bottom:8px; width:2px;
    background:linear-gradient(var(--rule), var(--rule)); 
  }
  .stage{position:relative; margin:0 0 16px}
  .num{
    position:absolute; left:-46px; top:14px; width:36px; height:36px; border-radius:50%;
    background:var(--card); border:2px solid var(--rule); color:var(--plan);
    display:grid; place-items:center; font-weight:650; font-size:15px;
  }
  .stage.done .num{background:var(--ok); border-color:var(--ok); color:#fff}
  .card{
    background:var(--card); border:1px solid var(--rule); border-radius:10px; overflow:hidden;
  }
  .head{
    width:100%; text-align:left; background:none; border:0; padding:16px 18px;
    display:flex; align-items:flex-start; gap:12px;
  }
  .head:hover{background:#FAF9FC}
  .head h2{margin:0; font-size:17px; font-weight:650; flex:1}
  .goal{margin:4px 0 0; font-size:14.5px; color:var(--ink2); font-weight:400}
  .effort{font-size:13px; color:var(--ink2); white-space:nowrap; padding-top:2px}
  .chev{color:var(--ink2); transition:transform .2s}
  .stage[open] .chev{transform:rotate(90deg)}

  .chips{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 0}
  .chip{
    font-size:12px; border:1px solid var(--rule); border-radius:99px;
    padding:2px 9px; color:var(--ink2); background:var(--paper);
  }
  .chip.req{border-color:#CFC7E6; color:var(--plan)}

  .body{padding:0 18px 18px; border-top:1px solid var(--rule); display:none}
  .stage[open] .body{display:block}
  .body h3{
    margin:16px 0 6px; font-size:13.5px; font-weight:650; color:var(--ink2);
  }
  .body ul{margin:0; padding-left:18px}
  .body li{margin:3px 0}
  /* .body ul 이 .checks 보다 우선순위가 높아 들여쓰기가 어긋난다. 같은 무게로 맞춘다 */
  .body ul.checks{list-style:none; padding-left:0; margin:0}
  .checks li{display:flex; gap:9px; align-items:flex-start; padding:4px 0}
  .checks input{margin-top:5px; width:16px; height:16px; accent-color:var(--ok); flex:0 0 auto}
  .checks label{cursor:pointer}
  .checks input:checked + label{color:var(--ink2); text-decoration:line-through}

  .say{
    margin:8px 0 0; background:#FAF9FC; border:1px solid var(--rule); border-radius:8px;
    padding:12px 14px; font-family:var(--mono); font-size:13.5px; line-height:1.65;
    white-space:pre-wrap; word-break:break-word;
  }
  .copy{
    margin:8px 0 0; background:var(--card); border:1px solid var(--rule);
    border-radius:6px; padding:6px 11px; font-size:13.5px;
  }
  .copy:hover{border-color:var(--plan); color:var(--plan)}

  /* 단계 시작 파일 */
  .brieflab{margin:4px 0 10px; font-size:14px; color:var(--ink2)}
  .brieflab b{color:var(--ink)}
  .getbrief{
    background:var(--plan); border:1px solid var(--plan); color:#fff;
    border-radius:6px; padding:9px 14px; font-size:14px; font-weight:600;
  }
  .getbrief:hover{filter:brightness(1.08)}
  .peek{margin:10px 0 0}
  .peek summary{font-size:13.5px; color:var(--ink2); cursor:pointer}
  .peek summary:hover{color:var(--plan)}
  .peek .say{max-height:320px; overflow:auto; font-size:13px}
  .risk{
    margin:14px 0 0; padding:10px 12px; border-left:3px solid var(--warn);
    background:#FBF6F1; font-size:14.5px;
  }

  /* 개발하다가 바꾸고 싶어진 것을 적어 두는 칸 */
  .memo{
    width:100%; margin:6px 0 0; padding:10px 12px; font:inherit; font-size:14.5px;
    border:1px solid var(--rule); border-radius:8px; background:#FCFCFE; color:inherit;
    resize:vertical; min-height:64px;
  }
  .memo:focus{border-color:var(--plan); outline:none}
  .dot{
    width:7px; height:7px; border-radius:50%; background:var(--warn);
    display:inline-block; margin-left:6px; vertical-align:middle;
  }
  .stage:not(.hasmemo) .dot{display:none}

  .sheet{
    margin:26px 0 0; background:var(--card); border:1px solid var(--plan);
    border-radius:10px; padding:18px; display:none;
  }
  .sheet.on{display:block}
  .sheet h2{margin:0 0 4px; font-size:16px}
  .sheet p{margin:0 0 12px; font-size:14px; color:var(--ink2)}
  .sheet pre{
    margin:0; padding:14px; background:#FAF9FC; border:1px solid var(--rule); border-radius:8px;
    font-family:var(--mono); font-size:13px; line-height:1.6; white-space:pre-wrap;
    word-break:break-word; max-height:320px; overflow:auto;
  }
  .sheet .row{display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 0}

  .revs{margin:26px 0 0; font-size:14px; color:var(--ink2)}
  .revs h2{margin:0 0 8px; font-size:15px; color:var(--ink); font-weight:650}
  .revs li{margin:4px 0}
  .ver{
    font-size:13px; border:1px solid var(--rule); border-radius:99px; padding:2px 10px;
    color:var(--plan); vertical-align:middle; margin-left:10px; font-weight:600;
  }

  .divider{
    margin:22px 0 26px -46px; display:flex; align-items:center; gap:12px;
    color:var(--plan); font-size:13.5px; font-weight:600;
  }
  .divider::after{content:""; flex:1; height:2px; background:var(--plan); opacity:.35}
  .later .card{background:#FBFAFD}
  .later .num{color:var(--ink2)}

  /* 아래 묶음 */
  .notes{margin:40px 0 0; display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .note{background:var(--card); border:1px solid var(--rule); border-radius:10px; padding:16px 18px}
  .note h2{margin:0 0 8px; font-size:15px; font-weight:650}
  .note ul{margin:0; padding-left:18px; font-size:14.5px; color:var(--ink2)}
  .note.no h2{color:var(--warn)}
  .foot{margin:36px 0 0; font-size:13px; color:var(--ink2); border-top:1px solid var(--rule); padding-top:14px}

  @media (max-width:640px){
    .wrap{padding:22px 14px 60px}
    h1{font-size:23px}
    .lane{padding-left:34px}
    .lane::before{left:13px}
    .num{left:-34px; width:28px; height:28px; font-size:13px; top:12px}
    .divider{margin-left:-34px}
    .head{padding:14px; flex-wrap:wrap}
    .effort{order:3; width:100%; padding-top:6px}
    .body{padding:0 14px 14px}
  }
  @media print{
    .toolbar,.copy{display:none}
    .body{display:block !important}
    .card{break-inside:avoid}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
  :focus-visible{outline:2px solid var(--plan); outline-offset:2px}
</style>
</head>

<div class="wrap">
  <header>
    <h1 id="ttl"></h1>
    <p class="one" id="one"></p>
    <div class="facts" id="facts"></div>
    <div class="bar"><i id="barfill"></i></div>
    <p class="barlab" id="barlab"></p>
    <div class="toolbar">
      <button id="mvponly" aria-pressed="false">1차 출시까지만 보기</button>
      <button id="expand">전부 펼치기</button>
      <button id="collect">바꾸고 싶은 것 모으기 <span id="memocount"></span></button>

      <button id="reset">체크 지우기</button>
    </div>
  </header>

  <section class="sheet" id="sheet" aria-live="polite">
    <h2>계획 수정 요청서</h2>
    <p>아래 내용을 복사해서 클로드에게 붙여 넣고 "이거 반영해서 계획 다시 그려 줘"라고 하시면 됩니다.</p>
    <pre id="sheettext"></pre>
    <div class="row">
      <button class="copy" id="sheet-copy">복사</button>
      <button class="copy" id="sheet-dl">파일로 내려받기 (.md)</button>
      <button class="copy" id="sheet-close">닫기</button>
    </div>
  </section>

  <div class="lane" id="lane"></div>

  <div class="note" style="margin:26px 0 0">
    <h2>단계와 상관없이 바꾸고 싶은 것 <span class="dot" id="gdot"></span></h2>
    <textarea class="memo" id="memo-all" placeholder="예: 전체적으로 글자가 작아요 / 색이 너무 화려해요 / 순서를 바꾸고 싶어요"></textarea>
  </div>

  <div class="revs" id="revs"></div>
  <div class="notes" id="notes"></div>
  <p class="foot">이 계획은 만들기 전에 그린 지도입니다. 하다 보면 바뀝니다. 바뀐 이유를 적어 두면 다음 계획이 정확해집니다.</p>

<script>
(function(){
  const D = JSON.parse(document.getElementById('plan-data').textContent);
  const specRaw = document.getElementById('spec-md').textContent.trim();
  const SPEC = specRaw ? new TextDecoder().decode(
    Uint8Array.from(atob(specRaw), c => c.charCodeAt(0))) : '';
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  const stages = D.stages || [];
  const reqs = D.requirements || [];
  const reqTitle = id => (reqs.find(r => r.id === id) || {}).title || id;
  const KEY = 'vibe-plan:' + (D.project && D.project.slug ? D.project.slug : 'plan');

  // 저장은 되면 좋고 안 되면 그만. 미리보기 창에서는 막혀 있을 수 있다.
  const store = {
    read(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } },
    write(v){ try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} }
  };
  let checked = store.read();

  // 바꾸고 싶은 것을 적어 두는 메모. 체크와 따로 저장한다.
  const memoStore = {
    read(){ try { return JSON.parse(localStorage.getItem(KEY + ':memo') || '{}'); } catch (e) { return {}; } },
    write(v){ try { localStorage.setItem(KEY + ':memo', JSON.stringify(v)); } catch (e) {} }
  };
  let memos = memoStore.read();

  $('ttl').textContent = (D.project && D.project.title) || '만들 것';
  if (D.version && D.version > 1) {
    const b = document.createElement('span');
    b.className = 'ver'; b.textContent = '판 ' + D.version;
    $('ttl').appendChild(b);
  }
  $('one').textContent = (D.project && D.project.oneLiner) || '';

  const mvp = stages.filter(s => s.phase !== 'later');
  const facts = [];
  if (D.project && D.project.who) facts.push(['쓸 사람', D.project.who]);
  facts.push(['1차 출시까지', mvp.length + '단계']);
  if (stages.length > mvp.length) facts.push(['그 뒤', (stages.length - mvp.length) + '단계']);
  if (D.project && D.project.deadline) facts.push(['기한', D.project.deadline]);
  if (D.project && D.project.where) facts.push(['올릴 곳', D.project.where]);
  $('facts').innerHTML = facts.map(f => '<div>' + esc(f[0]) + ' <b>' + esc(f[1]) + '</b></div>').join('');

  function checkId(si, ci){ return 's' + si + 'c' + ci; }

  function stageHTML(s, si){
    const checks = s.check || [];
    const chips = []
      .concat((s.reqs || []).map(r => '<span class="chip req">' + esc(reqTitle(r)) + '</span>'))
      .concat(s.phase === 'later' ? ['<span class="chip">1차 이후</span>'] : []);
    const list = (arr, cls) => (arr && arr.length)
      ? '<ul class="' + (cls || '') + '">' + arr.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '';

    return '' +
    '<div class="stage' + (s.phase === 'later' ? ' later' : '') + '" data-i="' + si + '">' +
      '<div class="num">' + (si + 1) + '</div>' +
      '<div class="card">' +
        '<button class="head" aria-expanded="false">' +
          '<span class="chev">▶</span>' +
          '<span style="flex:1">' +
            '<h2>' + esc(s.title || '단계') + '<span class="dot" title="바꾸고 싶은 것이 적혀 있습니다"></span></h2>' +
            (s.goal ? '<span class="goal">' + esc(s.goal) + '</span>' : '') +
            (chips.length ? '<span class="chips">' + chips.join('') + '</span>' : '') +
          '</span>' +
          (s.effort ? '<span class="effort">' + esc(s.effort) + '</span>' : '') +
        '</button>' +
        '<div class="body">' +
          (s.tasks && s.tasks.length ? '<h3>여기서 하는 일</h3>' + list(s.tasks) : '') +
          (s.outputs && s.outputs.length ? '<h3>끝나면 생기는 것</h3>' + list(s.outputs) : '') +
          (checks.length ? '<h3>내가 직접 확인할 것</h3><ul class="checks">' + checks.map((c, ci) => {
            const id = checkId(si, ci);
            return '<li><input type="checkbox" id="' + id + '"' + (checked[id] ? ' checked' : '') +
                   '><label for="' + id + '">' + esc(c) + '</label></li>';
          }).join('') + '</ul>' : '') +
          (s.brief ? '<h3>이 단계 시작 파일</h3>' +
                     '<p class="brieflab">아래 파일을 내려받아 클로드에 <b>올린 뒤</b> "이 파일대로 시작해 줘"라고 하세요. ' +
                     '붙여 넣을 필요 없이 파일 하나만 올리면 됩니다.</p>' +
                     '<button class="getbrief" data-i="' + si + '">' + esc(s.briefFile || '시작 파일') + ' 내려받기</button>' +
                     '<details class="peek"><summary>파일 안에 뭐가 들었는지 보기</summary>' +
                     '<pre class="say">' + esc(s.brief) + '</pre></details>' : '') +
          (s.risk ? '<div class="risk"><b>주의</b> ' + esc(s.risk) + '</div>' : '') +
          '<h3>이 단계에서 바꾸고 싶은 것</h3>' +
          '<textarea class="memo" data-key="s' + si + '" placeholder="만들다가 생각이 바뀌면 여기에 적어 두세요. 나중에 한 번에 모아 드립니다">' +
            esc(memos['s' + si] || '') + '</textarea>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  let html = '';
  stages.forEach((s, i) => {
    if (s.phase === 'later' && (i === 0 || stages[i-1].phase !== 'later')) {
      html += '<div class="divider">여기까지가 1차 출시</div>';
    }
    html += stageHTML(s, i);
  });
  $('lane').innerHTML = html || '<p>단계가 없습니다.</p>';

  const notes = [];
  if (D.notMaking && D.notMaking.length)
    notes.push(['no', '이번에는 만들지 않는 것', D.notMaking]);
  if (D.openQuestions && D.openQuestions.length)
    notes.push(['', '아직 정하지 못한 것', D.openQuestions]);
  if (D.risks && D.risks.length)
    notes.push(['', '어긋날 수 있는 것', D.risks.map(r =>
      typeof r === 'string' ? r : (r.what + (r.plan ? ' → ' + r.plan : '')))]);
  $('notes').innerHTML = notes.map(n =>
    '<div class="note ' + n[0] + '"><h2>' + esc(n[1]) + '</h2><ul>' +
    n[2].map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>').join('');

  // 지난 판에서 무엇이 바뀌었는지
  if (D.revisions && D.revisions.length) {
    $('revs').innerHTML = '<h2>바뀐 내역</h2>' + D.revisions.slice().reverse().map(r =>
      '<div style="margin:0 0 10px"><b>판 ' + esc(r.n) + '</b>' +
      (r.date ? ' · ' + esc(r.date) : '') + (r.why ? ' · ' + esc(r.why) : '') +
      ((r.changes && r.changes.length)
        ? '<ul>' + r.changes.map(c => '<li>' + esc(c) + '</li>').join('') + '</ul>' : '') +
      '</div>').join('');
  }

  // ── 바꾸고 싶은 것 모으기 ────────────────────────────
  const memoAll = $('memo-all');
  memoAll.value = memos.all || '';

  function refreshMemos(){
    document.querySelectorAll('.stage').forEach(el => {
      const box = el.querySelector('.memo');
      el.classList.toggle('hasmemo', !!(box && box.value.trim()));
    });
    $('gdot').style.display = (memos.all || '').trim() ? 'inline-block' : 'none';
    const n = Object.values(memos).filter(v => (v || '').trim()).length;
    $('memocount').textContent = n ? '(' + n + ')' : '';
  }

  function buildSheet(){
    const L = [];
    L.push('# 계획 수정 요청 — ' + ((D.project && D.project.title) || '만들 것'));
    L.push('');
    L.push('현재 판: ' + (D.version || 1) + ' / 적은 날: ' + new Date().toISOString().slice(0, 10));
    L.push('');
    stages.forEach((s, i) => {
      const v = (memos['s' + i] || '').trim();
      if (v) {
        L.push('## ' + (i + 1) + '단계 · ' + (s.title || ''));
        v.split('\n').forEach(line => L.push(line.trim() ? '- ' + line.trim() : ''));
        L.push('');
      }
    });
    const all = (memos.all || '').trim();
    if (all) {
      L.push('## 전체');
      all.split('\n').forEach(line => L.push(line.trim() ? '- ' + line.trim() : ''));
      L.push('');
    }
    if (L.length <= 4) L.push('(아직 적은 내용이 없습니다)');
    L.push('---');
    L.push('이 내용을 클로드에 붙여 넣고 "이거 반영해서 계획 다시 그려 줘"라고 하면 됩니다.');
    return L.join('\n');
  }

  function saveMemo(key, value){
    if (value.trim()) memos[key] = value; else delete memos[key];
    memoStore.write(memos); refreshMemos();
    if ($('sheet').classList.contains('on')) $('sheettext').textContent = buildSheet();
  }

  memoAll.addEventListener('input', e => saveMemo('all', e.target.value));
  $('lane').addEventListener('input', e => {
    if (e.target.matches('.memo')) saveMemo(e.target.dataset.key, e.target.value);
  });

  $('collect').onclick = () => {
    $('sheettext').textContent = buildSheet();
    $('sheet').classList.add('on');
    $('sheet').scrollIntoView({behavior: 'smooth', block: 'start'});
  };
  $('sheet-close').onclick = () => $('sheet').classList.remove('on');
  $('sheet-copy').onclick = e => copyText(buildSheet(), e.currentTarget);
  $('sheet-dl').onclick = () => {
    const name = ((D.project && D.project.slug) || 'plan') + '-수정요청.md';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([buildSheet()], {type: 'text/markdown;charset=utf-8'}));
    a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  };

  function copyText(text, btn){
    const label = btn.textContent;
    const done = () => { btn.textContent = '복사했습니다'; setTimeout(() => btn.textContent = label, 1600); };
    if (navigator.clipboard) { navigator.clipboard.writeText(text).then(done, fallback); }
    else fallback();
    function fallback(){
      const t = document.createElement('textarea');
      t.value = text; document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); done(); } catch (err) { btn.textContent = '복사 실패'; }
      t.remove();
    }
  }

  function progress(){
    const boxes = [...document.querySelectorAll('.checks input')];
    const done = boxes.filter(b => b.checked).length;
    const pct = boxes.length ? done / boxes.length * 100 : 0;
    $('barfill').style.width = pct + '%';
    $('barlab').textContent = boxes.length
      ? '확인 항목 ' + done + ' / ' + boxes.length + ' 완료'
      : '확인 항목이 아직 없습니다';
    document.querySelectorAll('.stage').forEach(el => {
      const inputs = [...el.querySelectorAll('.checks input')];
      el.classList.toggle('done', inputs.length > 0 && inputs.every(b => b.checked));
    });
  }

  function saveFile(name, text, mime){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], {type: mime + ';charset=utf-8'}));
    a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }

  $('lane').addEventListener('click', e => {
    const head = e.target.closest('.head');
    if (head) {
      const st = head.closest('.stage');
      const open = st.hasAttribute('open');
      st.toggleAttribute('open', !open);
      head.setAttribute('aria-expanded', String(!open));
      return;
    }
    const get = e.target.closest('.getbrief');
    if (get && get.dataset.i !== undefined) {
      const s = stages[+get.dataset.i];
      saveFile(s.briefFile || 'stage.md', s.brief || '', 'text/markdown');
      const was = get.textContent;
      get.textContent = '내려받았습니다';
      setTimeout(() => get.textContent = was, 1800);
    }
  });

  $('lane').addEventListener('change', e => {
    if (e.target.matches('.checks input')) {
      checked[e.target.id] = e.target.checked;
      store.write(checked); progress();
    }
  });

  $('mvponly').onclick = e => {
    const on = e.currentTarget.getAttribute('aria-pressed') !== 'true';
    e.currentTarget.setAttribute('aria-pressed', String(on));
    document.querySelectorAll('.stage.later, .divider').forEach(el => el.style.display = on ? 'none' : '');
  };
  $('expand').onclick = e => {
    const anyClosed = [...document.querySelectorAll('.stage')].some(s => !s.hasAttribute('open'));
    document.querySelectorAll('.stage').forEach(s => {
      s.toggleAttribute('open', anyClosed);
      s.querySelector('.head').setAttribute('aria-expanded', String(anyClosed));
    });
    e.currentTarget.textContent = anyClosed ? '전부 접기' : '전부 펼치기';
  };
  $('reset').onclick = () => {
    checked = {}; store.write(checked);
    document.querySelectorAll('.checks input').forEach(b => b.checked = false);
    progress();
  };
  if (SPEC) {
    $('dl-spec').onclick = () => {
      const name = ((D.project && D.project.slug) || 'project') + '-requirements.md';
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([SPEC], {type: 'text/markdown;charset=utf-8'}));
      a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    };
  } else {
    $('dl-spec').style.display = 'none';
  }

  // 첫 단계는 펼쳐 둔다. 열자마자 무엇부터 하면 되는지 보이는 편이 낫다.
  const first = document.querySelector('.stage');
  if (first) { first.setAttribute('open', ''); first.querySelector('.head').setAttribute('aria-expanded', 'true'); }
  progress();
  refreshMemos();
})();
</script>
</body>
</html>
